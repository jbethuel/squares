name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input on purpose: the action reads `packageManager` from
      # package.json, so the version lives in one place. Setting both is an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # ADR 0002: the artefact is a static export, so a green build means the
      # thing that actually ships still builds.
      - run: pnpm build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input on purpose: the action reads `packageManager` from
      # package.json, so the version lives in one place. Setting both is an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The only project in playwright.config.ts is chromium.
      # playwright is a dependency of the web app, not of the workspace root.
      - run: pnpm --filter @squares/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # In CI the reporter is `line`, so there is no HTML report — traces from
      # the first retry land in test-results/ and are all that is worth keeping.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
