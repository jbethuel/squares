packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # The same call as workerd below, for the same reason. Its postinstall unpacks
  # the prebuilt Skia binaries the native build links against. Expo Go has Skia
  # compiled in already and would not miss them, so denying this looks fine
  # right up until the first `expo run:ios` or EAS build, which is exactly the
  # kind of delayed breakage the ruling exists to avoid.
  '@shopify/react-native-skia': true
  esbuild: false
  sharp: false
  # Not the app's — wrangler pulls it in when the deploy workflow installs it,
  # and pnpm fails rather than warns on a build script it has no ruling for.
  # Allowed rather than denied: the script is what puts the platform binary in
  # place, so denying it would work for `pages deploy` and then quietly break
  # anyone who reaches for `wrangler dev`.
  workerd: true

# Each entry here waived pnpm's release-age hold for one SDK 57 patch that was
# still too new to install. The app has since moved past every one of them — it
# is on expo-constants 57.0.18, expo-notifications 57.0.18, expo-file-system
# 57.0.7 and expo-sharing 57.0.19 — so the waivers named versions that are no
# longer resolved and were holding nothing open. Name a version here again only
# when the hold actually blocks an install, and delete it once it has aged out;
# a stale waiver reads like a live constraint.
